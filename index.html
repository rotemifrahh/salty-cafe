<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Salty — Arugam Bay</title>
    <style>
      html { scroll-behavior: smooth; }
      *, *::before, *::after { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        color: #f4efe6;
        background: #2a1b12;
      }
      section {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 4.5rem 1.5rem 3.5rem;
      }
      .eyebrow {
        margin: 0;
        font-size: 0.68rem;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        opacity: 0.7;
      }
      h1, h2 { margin: 0.35rem 0 1.4rem; }
      h1 {
        display: flex;
        flex-direction: column;
        align-items: center;
        line-height: 0.82;
      }
      h2 {
        font-size: clamp(2.4rem, 8vw, 4.2rem);
        font-weight: 500;
        letter-spacing: -0.03em;
      }
      .name {
        font-size: clamp(4.2rem, 16vw, 8.5rem);
        font-weight: 500;
        letter-spacing: -0.045em;
      }
      .script {
        font-family: Georgia, "Times New Roman", serif;
        font-style: italic;
        font-weight: 400;
        font-size: clamp(2.4rem, 9vw, 4.6rem);
        margin-top: -0.12em;
      }
      .next {
        color: inherit;
        text-decoration: none;
        font-size: 1.35rem;
        border: 1px solid rgba(244, 239, 230, 0.45);
        width: 2.4rem;
        height: 2.4rem;
        display: grid;
        place-items: center;
        border-radius: 999px;
        margin-top: 0.5rem;
      }
      .hero {
        justify-content: flex-end;
        padding-bottom: 4rem;
        background:
          linear-gradient(to top, rgba(28, 16, 10, 0.62), rgba(28, 16, 10, 0.12) 45%),
          url("https://images.unsplash.com/photo-1502680390469-be45c6c77f08?auto=format&fit=crop&w=1800&q=80") center / cover no-repeat;
      }
      .menu { background: #24160f; }
      .menu-list {
        list-style: none;
        margin: 0 0 2rem;
        padding: 0;
        width: min(28rem, 100%);
      }
      .menu-list li {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.85rem 0;
        border-bottom: 1px solid rgba(244, 239, 230, 0.18);
        font-size: 1.05rem;
      }
      .gallery { background: #1c120c; }
      .gallery-grid {
        display: grid;
        gap: 0.75rem;
        width: min(56rem, 100%);
        grid-template-columns: 1fr;
      }
      @media (min-width: 720px) {
        .gallery-grid {
          grid-template-columns: 1.2fr 0.8fr;
          grid-template-rows: 12rem 12rem;
        }
        .shot-a { grid-row: 1 / 3; }
      }
      .shot {
        margin: 0;
        min-height: 10rem;
        display: flex;
        align-items: flex-end;
        padding: 0.9rem;
        font-size: 0.75rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .shot-a { background: #8b5a32; }
      .shot-b { background: #c4a574; color: #2a1b12; }
      .shot-c { background: #5c3a24; }
    </style>
  </head>
  <body>
    <section class="hero" id="top">
      <p class="eyebrow">Arugam Bay</p>
      <h1>
        <span class="name">Salty</span>
        <span class="script">cafe</span>
      </h1>
      <a class="next" href="#menu">→</a>
    </section>
    <section class="menu" id="menu">
      <p class="eyebrow">The board</p>
      <h2>Menu</h2>
      <ul class="menu-list">
        <li><span>Iced coffee</span><span>450</span></li>
        <li><span>King coconut</span><span>300</span></li>
        <li><span>Smoothie bowl</span><span>1200</span></li>
        <li><span>Egg hopper</span><span>800</span></li>
        <li><span>Banana pancake</span><span>900</span></li>
      </ul>
      <a class="next" href="#gallery">→</a>
    </section>
    <section class="gallery" id="gallery">
      <p class="eyebrow">The room</p>
      <h2>Gallery</h2>
      <div class="gallery-grid">
        <figure class="shot shot-a"><span>Board rack</span></figure>
        <figure class="shot shot-b"><span>Shade</span></figure>
        <figure class="shot shot-c"><span>Sand floor</span></figure>
      </div>
    </section>
  </body>
</html>
