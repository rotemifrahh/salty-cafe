<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Salty — Arugam Bay</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap");
@import url("https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600&display=swap");
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;min-height:100vh;overflow:hidden;position:relative;cursor:none}
a,button{cursor:none}
#top-gradient{position:fixed;top:-30vh;left:0;width:100vw;z-index:0;pointer-events:none}
.hero-content{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:6vh;width:95%;max-width:1100px;margin:0 auto}
.hero-title{font-family:"Playfair Display",Georgia,serif;font-size:2.8rem;font-weight:400;color:#fff;line-height:1.15;margin-bottom:2.2rem;letter-spacing:-.015em;text-shadow:0 4px 30px rgba(0,0,0,.5)}
.hero-title .word-wrapper{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.15em;margin-bottom:-.15em}
.hero-title .word-inner{display:inline-block;opacity:0;transform:translateY(105%);filter:blur(20px);animation:word-reveal-mask 1.3s cubic-bezier(.05,.9,.1,1) forwards}
@keyframes word-reveal-mask{0%{opacity:0;transform:translateY(105%);filter:blur(20px)}30%{opacity:1}100%{opacity:1;transform:translateY(0);filter:blur(0)}}
.hero-btn{font-family:Outfit,sans-serif;font-size:1.1rem;font-weight:500;color:#fff;background:#000;border:1px solid rgba(255,255,255,.18);padding:1.3rem 2.5rem;border-radius:9999px;display:inline-flex;align-items:center;gap:.9rem;transition:all .3s cubic-bezier(.16,1,.3,1)}
.hero-btn:hover{background:#fff;color:#000;transform:translateY(-2px)}
.blinking-dot{width:10px;height:10px;background:#E8D5A3;border-radius:50%;position:relative;animation:pulse-glow 2s infinite ease-in-out}
.blinking-dot::after{content:"";position:absolute;inset:-5px;background:rgba(232,213,163,.45);border-radius:50%;animation:wave-expand 2s infinite ease-in-out}
@keyframes pulse-glow{0%,100%{opacity:.5;transform:scale(.85)}50%{opacity:1;transform:scale(1.1);box-shadow:0 0 12px rgba(232,213,163,.9)}}
@keyframes wave-expand{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.3);opacity:0}}
.footer-container{position:fixed;top:50vh;left:20px;right:20px;width:calc(100vw - 40px);transform:translateY(-50%);z-index:3;display:flex;flex-direction:column}
.footer-top{display:flex;justify-content:space-between;align-items:flex-end;padding:0 5px}
.footer-title{font-family:"General Sans",sans-serif;font-size:1.4rem;font-weight:400;color:#fff}
.footer-divider{border:none;height:1px;background:rgba(255,255,255,.2);margin:1.6rem 0}
.footer-bottom{display:flex;justify-content:space-between;align-items:center;padding:0 5px}
.footer-socials{display:flex;gap:1.25rem;flex:1}
.social-icon{color:rgba(255,255,255,.55);transition:.3s}
.social-icon:hover{color:#fff;transform:translateY(-2px)}
.footer-links{display:flex;gap:2.8rem;justify-content:center;flex:2}
.footer-link{font-family:Outfit,sans-serif;font-size:.95rem;color:#fff;text-decoration:none}
.footer-copyright{font-family:Outfit,sans-serif;font-size:.95rem;color:rgba(255,255,255,.45);text-align:right;flex:1}
.footer-logo-wrap{position:fixed;bottom:20px;left:0;right:0;display:flex;justify-content:center;z-index:3;padding:0 20px}
.footer-logo-text{font-family:"General Sans",sans-serif;font-size:32vw;font-weight:400;color:#fff;letter-spacing:-.03em;transform:translateX(-20px);line-height:.8;width:100%;text-align:center;pointer-events:none;white-space:nowrap;opacity:.95}
.footer-logo-text .letter-wrapper{display:inline-block;overflow:hidden;line-height:.8}
.footer-logo-text .letter-inner{display:inline-block;opacity:0;transform:translateX(-105%);filter:blur(20px);animation:letter-reveal-mask 1.2s cubic-bezier(.05,.9,.1,1) forwards}
@keyframes letter-reveal-mask{0%{opacity:0;transform:translateX(-105%);filter:blur(20px)}25%{opacity:1}100%{opacity:.95;transform:translateX(0);filter:blur(0)}}
.video-container{position:fixed;bottom:0;left:0;width:100vw;height:90vh;overflow:hidden;z-index:-1}
#bg-video{width:100%;height:110%;object-fit:cover}
.glass-cursor-card{position:fixed;top:0;left:0;z-index:99999;pointer-events:none;padding:.75rem 1.5rem;background:rgba(255,255,255,.08);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.18);border-radius:9999px;transform:translate(-50%,-50%) scale(0);opacity:0}
.glass-cursor-card.active{opacity:1}
.cursor-card-text{font-family:"General Sans",sans-serif;font-size:.85rem;font-weight:500;letter-spacing:.06em;color:#E8D5A3;text-transform:uppercase;white-space:nowrap}
.cursor-card-text .text-white{color:#fff}
.cursor-ring-outline{position:fixed;top:0;left:0;width:48px;height:48px;border:1.5px solid rgba(255,255,255,.45);border-radius:50%;z-index:99998;pointer-events:none;transform:translate(-50%,-50%) scale(0);opacity:0}
.cursor-ring-outline.active{opacity:1}
.cursor-ring-outline.expanded{border-color:rgba(255,255,255,.15)}
@media(max-width:800px){.hero-title{font-size:1.85rem}.footer-title{font-size:1.05rem}.footer-links{gap:1rem}.footer-logo-text{font-size:26vw}}
</style></head>
<body>
<img src="https://api.getlayers.ai/storage/v1/object/public/public/assets/loopstack-f8c64439bf/black_gradient.svg" alt="" id="top-gradient" />
<main class="hero-content">
<h1 class="hero-title">Coffee after the set <br> in Arugam Bay</h1>
<button class="hero-btn"><span class="btn-text">See the board</span><span class="blinking-dot"></span></button>
</main>
<footer class="footer-container">
<div class="footer-top"><h2 class="footer-title">Stay in Touch</h2><h2 class="footer-title quote">Surf. Sit. Repeat.</h2></div>
<hr class="footer-divider" />
<div class="footer-bottom">
<div class="footer-socials">
<a href="#" class="social-icon" aria-label="Instagram"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg></a>
</div>
<nav class="footer-links">
<a href="#menu" class="footer-link">Menu</a>
<a href="#hours" class="footer-link">Hours</a>
<a href="#visit" class="footer-link">Visit</a>
<a href="#about" class="footer-link">About</a>
</nav>
<div class="footer-copyright">© 2026 Salty</div>
</div>
</footer>
<div class="footer-logo-wrap"><h2 class="footer-logo-text">Salty</h2></div>
<div class="video-container"><video autoplay muted playsinline loop id="bg-video"><source src="https://videos.pexels.com/video-files/1409899/1409899-hd_1920_1080_25fps.mp4" type="video/mp4" /></video></div>
<div id="cursor-ring" class="cursor-ring-outline"></div>
<div id="glass-card" class="glass-cursor-card"><span class="cursor-card-text"><span class="text-white">Sit</span> Down</span></div>
<script>
document.addEventListener("DOMContentLoaded",()=>{
const logoText=document.querySelector(".footer-logo-text");
if(logoText){const text=logoText.textContent.trim();logoText.innerHTML="";[...text].forEach((char,i)=>{const w=document.createElement("span");w.className="letter-wrapper";const n=document.createElement("span");n.textContent=char;n.className="letter-inner";n.style.animationDelay=i*.09+"s";w.appendChild(n);logoText.appendChild(w);});}
const heroTitle=document.querySelector(".hero-title");
if(heroTitle){const parts=heroTitle.innerHTML.split(/(\s+|<br\s*\/?>)/i);heroTitle.innerHTML="";let wi=0;parts.forEach(part=>{if(part.trim()==="")heroTitle.appendChild(document.createTextNode(" "));else if(part.toLowerCase().startsWith("<br"))heroTitle.appendChild(document.createElement("br"));else{const w=document.createElement("span");w.className="word-wrapper";const n=document.createElement("span");n.className="word-inner";n.textContent=part;n.style.animationDelay=wi*.1+"s";wi++;w.appendChild(n);heroTitle.appendChild(w);}});}
const glassCard=document.getElementById("glass-card"),cursorRing=document.getElementById("cursor-ring");
if(glassCard&&cursorRing){let mx=innerWidth/2,my=innerHeight/2,cx=mx,cy=my,rx=mx,ry=my,first=true,scale=0,target=0,hover=false;
addEventListener("mousemove",e=>{mx=e.clientX;my=e.clientY;if(first){cx=mx;cy=my;rx=mx;ry=my;first=false;glassCard.classList.add("active");cursorRing.classList.add("active");}if(!hover)target=1;});
addEventListener("mouseleave",()=>target=0);
addEventListener("mouseenter",()=>{if(!hover)target=1;});
const btn=document.querySelector(".hero-btn");
if(btn){btn.onmouseenter=()=>{hover=true;target=0;cursorRing.classList.add("expanded")};btn.onmouseleave=()=>{hover=false;target=1;cursorRing.classList.remove("expanded")};}
(function loop(){cx+=(mx-cx)*0.08;cy+=(my-cy)*0.08;rx=mx;ry=my;scale+=(target-scale)*0.15;const rs=cursorRing.classList.contains("expanded")?1.6*scale:scale;glassCard.style.transform=`translate3d(${cx}px,${cy}px,0) translate(-50%,-50%) scale(${scale})`;cursorRing.style.transform=`translate3d(${rx}px,${ry}px,0) translate(-50%,-50%) scale(${rs})`;requestAnimationFrame(loop);})();}
});
</script>
</body></html>
